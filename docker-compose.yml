# Local use on a Linux Docker host. For a Synology NAS use
# deploy/synology/docker-compose.yml and docs/synology.md.
services:
  tunneldeck:
    build: .
    image: magpeek/tunneldeck-vpn:0.4.2
    container_name: tunneldeck
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data
    # Web UI: listens on the host's LAN address, port 8194; never reachable
    # through the VPN tunnel. To change address or port set TUNNELDECK_LISTEN,
    # e.g. TUNNELDECK_LISTEN: "192.168.1.10:9000".
    # Remote access over the VPN is HTTPS only: enable it on the System page
    # (default port 8443, freely selectable).
    environment:
      TZ: Europe/Berlin
      # Optional, see docs/SPEC.md §10:
      # TUNNELDECK_LISTEN: "192.168.1.10:8194"  # default: default-route interface, port 8194
      # TUNNELDECK_LOG_LEVEL: info              # debug | info | warn | error
      # TUNNELDECK_IPTABLES: auto               # auto (host firewall's backend) | nft | legacy
      # TUNNELDECK_SECRET_KEY: ""               # base64 key instead of /data/secret.key
      # TUNNELDECK_RESET_ADMIN: "1"             # removes the admin account at every start; remove again
    restart: unless-stopped
