services:
  openvpn-mdex:
    image: alpine:3.20
    container_name: openvpn-mdex
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /volume1/docker/openvpn-mdex:/vpn
    restart: unless-stopped
    command: sh -c "apk add --no-cache openvpn && exec openvpn --config /vpn/client.ovpn"
