name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # End-to-end matrix (test/e2e/README.md): three OpenVPN test servers,
  # iptables-legacy and iptables-nft, then the firewall cases with a LAN and
  # strongSwan. Builds the images itself; the matrix takes about 4.5 minutes
  # and the firewall cases about 3 minutes on top of the build.
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The TUN device, both iptables backends with their nat and mangle
      # tables, and IPsec (ESP, xfrm) must be available in the runner's
      # kernel; the containers cannot load modules themselves.
      - run: sudo modprobe -a tun ip_tables iptable_filter iptable_nat iptable_mangle nf_tables esp4 xfrm_user
      - run: go test -tags e2e -v -count=1 -timeout 45m ./test/e2e/

  image:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tunneldeck:ci
