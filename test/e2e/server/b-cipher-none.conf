# Variant B: like the mdex public.IP level-20 server (docs/openvpn-notes.md):
# username/password, no data-channel encryption (data-ciphers none, auth
# none), fragment/mssfix and a one-day renegotiation interval.
port 1194
proto udp
dev tun0
topology subnet
server 10.94.2.0 255.255.255.0
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh none
data-ciphers none
auth none
tun-mtu 1500
fragment 1448
mssfix
reneg-sec 86400
verify-client-cert none
username-as-common-name
duplicate-cn
script-security 2
auth-user-pass-verify /etc/openvpn/e2e/verify.sh via-file
keepalive 10 60
push "redirect-gateway def1"
push "route 192.0.2.0 255.255.255.0"
push "dhcp-option DNS 192.0.2.53"
verb 3
