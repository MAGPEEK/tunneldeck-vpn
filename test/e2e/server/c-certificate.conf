# Variant C: client certificate instead of a password, tls-crypt on the
# control channel, TCP transport, TLS 1.2 minimum.
port 1194
proto tcp
dev tun0
topology subnet
server 10.94.3.0 255.255.255.0
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh none
tls-crypt /etc/openvpn/pki/tc.key
tls-version-min 1.2
verify-client-cert require
remote-cert-tls client
duplicate-cn
keepalive 10 60
push "redirect-gateway def1"
verb 3
