# Variant A: username/password checked by verify.sh, CA-verified server,
# data cipher negotiated (AES-256-GCM). Pushes a default route, a route and
# DNS, which TunnelDeck must ignore.
port 1194
proto udp
dev tun0
topology subnet
server 10.94.1.0 255.255.255.0
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh none
verify-client-cert none
username-as-common-name
duplicate-cn
script-security 2
auth-user-pass-verify /etc/openvpn/e2e/verify.sh via-file
keepalive 10 60
push "redirect-gateway def1"
push "route 192.0.2.0 255.255.255.0"
push "dhcp-option DNS 192.0.2.53"
verb 3
