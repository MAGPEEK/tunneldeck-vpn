# End-to-end test stack, driven by e2e_test.go:
#
#   go test -tags e2e -v -timeout 30m ./test/e2e/
#
# Topology and assertions: README.md. Nothing here is published or reaches
# the internet apart from the image builds.
name: tunneldeck-e2e

x-server: &server
  image: tunneldeck-e2e-server:local
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  networks: [e2e]

# TunnelDeck runs in its own network namespace on the test network. That
# namespace plays the "host": SPEC §6 network_mode: host means exactly this
# namespace, so the routing and firewall assertions run inside it.
x-tunneldeck: &tunneldeck
  image: tunneldeck-e2e:local
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  networks: [e2e]
  # The API is published on a random loopback port for the test driver.
  ports: ["127.0.0.1::8194"]
  environment:
    TUNNELDECK_LOG_LEVEL: debug

services:
  server-a:
    <<: *server
    build: server
    command: [a-userpass]

  server-b:
    <<: *server
    command: [b-cipher-none]

  server-c:
    <<: *server
    command: [c-certificate]

  # All three detect the iptables backend automatically (README.md,
  # "iptables backends"). The first two see only one working backend: the
  # other backend's binaries are removed before the server starts.
  tunneldeck-legacy:
    <<: *tunneldeck
    build:
      context: ../..
      args:
        VERSION: 0.1.0-e2e
    entrypoint: ["/bin/sh", "-c", "rm -f /usr/sbin/xtables-nft-multi && exec /usr/local/bin/tunneldeck"]

  tunneldeck-nft:
    <<: *tunneldeck
    entrypoint: ["/bin/sh", "-c", "rm -f /usr/sbin/xtables-legacy-multi && exec /usr/local/bin/tunneldeck"]

  # Both backends work; a host firewall on nf_tables already drops TCP from
  # the tunnel, like ufw's "deny incoming". TunnelDeck must share that
  # backend, otherwise its host-access rules could not open a port.
  tunneldeck-shared:
    <<: *tunneldeck
    entrypoint:
      - /bin/sh
      - -c
      - >-
        { iptables-nft -w -C INPUT -i tdvpn0 -p tcp -j DROP 2>/dev/null ||
        iptables-nft -w -A INPUT -i tdvpn0 -p tcp -j DROP; } &&
        exec /usr/local/bin/tunneldeck

networks:
  e2e: {}
