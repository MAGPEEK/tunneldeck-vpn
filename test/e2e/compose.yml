# End-to-end test stack, driven by e2e_test.go:
#
#   go test -tags e2e -v -timeout 60m ./test/e2e/
#
# Topology and assertions: README.md. Nothing here is published or reaches
# the internet apart from the image builds.
name: tunneldeck-e2e

x-server: &server
  image: tunneldeck-e2e-server:local
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  networks: [e2e]

# TunnelDeck runs in its own network namespace on the test network. That
# namespace plays the "host": SPEC §6 network_mode: host means exactly this
# namespace, so the routing and firewall assertions run inside it.
x-tunneldeck: &tunneldeck
  image: tunneldeck-e2e:local
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  networks: [e2e]
  # The API is published on a random loopback port for the test driver.
  ports: ["127.0.0.1::8194"]
  environment:
    TUNNELDECK_LOG_LEVEL: debug

# A TunnelDeck that routes between the tunnel and the LAN network. With two
# networks the default-route address the UI listens on by default need not
# be the one Docker publishes the port to, so it listens on all addresses;
# the firewall still keeps the UI port closed to the tunnel.
x-tunneldeck-lan: &tunneldeck-lan
  <<: *tunneldeck
  environment:
    TUNNELDECK_LOG_LEVEL: debug
    TUNNELDECK_LISTEN: 0.0.0.0:8194
  sysctls:
    net.ipv4.ip_forward: "1"
  configs:
    - source: settings-v1
      target: /e2e/settings-v1.json
    - source: linux44-ip
      target: /e2e/linux44-ip.sh
    - source: no-connmark-iptables
      target: /e2e/no-connmark-iptables.sh

services:
  server-a:
    <<: *server
    build: server
    command: [a-userpass]

  server-b:
    <<: *server
    command: [b-cipher-none]

  server-c:
    <<: *server
    command: [c-certificate]

  # WireGuard server (variant D) in the userspace wireguard-go; healthy
  # once its device listens, so the test can read its public key.
  server-wg:
    image: tunneldeck-e2e-wgserver:local
    build: wgserver
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 listen-port | grep -qx 51820"]
      interval: 2s
      timeout: 2s
      retries: 15

  # IPsec gateway (variant E): strongSwan with a connection per sign-in
  # method and a net-to-net one; healthy once they are loaded.
  server-ipsec:
    image: tunneldeck-e2e-ipsecgw:local
    build: ipsecgw
    cap_add: [NET_ADMIN]
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "swanctl --list-conns | grep -q '^net:'"]
      interval: 2s
      timeout: 2s
      retries: 15

  # All three detect the iptables backend automatically (README.md,
  # "iptables backends"). The first two see only one working backend: the
  # other backend's binaries are removed before the server starts.
  tunneldeck-legacy:
    <<: *tunneldeck
    build:
      context: ../..
      args:
        VERSION: 0.1.0-e2e
    entrypoint: ["/bin/sh", "-c", "rm -f /usr/sbin/xtables-nft-multi && exec /usr/local/bin/tunneldeck"]

  tunneldeck-nft:
    <<: *tunneldeck
    entrypoint: ["/bin/sh", "-c", "rm -f /usr/sbin/xtables-legacy-multi && exec /usr/local/bin/tunneldeck"]

  # Both backends work; a host firewall on nf_tables already drops TCP from
  # the tunnel, like ufw's "deny incoming". TunnelDeck must share that
  # backend, otherwise its firewall rules could not open a port.
  tunneldeck-shared:
    <<: *tunneldeck
    entrypoint:
      - /bin/sh
      - -c
      - >-
        { iptables-nft -w -C INPUT -i tdvpn0 -p tcp -j DROP 2>/dev/null ||
        iptables-nft -w -A INPUT -i tdvpn0 -p tcp -j DROP; } &&
        exec /usr/local/bin/tunneldeck

  # Firewall part (README.md, "Firewall topology"): two TunnelDecks with a
  # second interface on the LAN network, one per iptables backend; the LAN
  # devices use the one under test as their gateway. Each starts with a
  # settings.json of schema version 1, copied only on the first start, so
  # the migration to version 2 runs against a real file. Both refuse the
  # ip rule selectors Linux 4.4 lacks (linux44-ip.sh); the nft one also
  # lacks CONNMARK (no-connmark-iptables.sh), so its port forwards route
  # their replies by source address.
  tunneldeck-lan-nft:
    <<: *tunneldeck-lan
    networks:
      e2e: {}
      lan:
        ipv4_address: 10.95.0.2
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rm -f /usr/sbin/xtables-legacy-multi &&
        mkdir -p /usr/local/sbin && install -m 0755 /e2e/linux44-ip.sh /usr/local/sbin/ip &&
        install -m 0755 /e2e/no-connmark-iptables.sh /usr/local/sbin/iptables-nft &&
        { [ -e /data/settings.json ] || cp /e2e/settings-v1.json /data/settings.json; } &&
        exec /usr/local/bin/tunneldeck

  tunneldeck-lan-legacy:
    <<: *tunneldeck-lan
    networks:
      e2e: {}
      lan:
        ipv4_address: 10.95.0.3
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rm -f /usr/sbin/xtables-nft-multi &&
        mkdir -p /usr/local/sbin && install -m 0755 /e2e/linux44-ip.sh /usr/local/sbin/ip &&
        { [ -e /data/settings.json ] || cp /e2e/settings-v1.json /data/settings.json; } &&
        exec /usr/local/bin/tunneldeck

  # A LAN device behind TunnelDeck with a web server that reports the client
  # address it sees.
  lan-web:
    image: tunneldeck-e2e-node:local
    build: node
    command: [web]
    cap_add: [NET_ADMIN]
    networks:
      lan:
        ipv4_address: 10.95.0.10

  # The IPsec router in the LAN (stand-in for a LANCOM): strongSwan with the
  # inner network 10.96.1.0/24 behind it.
  lan-ipsec:
    image: tunneldeck-e2e-node:local
    command: [ipsec]
    cap_add: [NET_ADMIN]
    environment:
      INNER_ADDRESS: 10.96.1.1/24
    networks:
      lan:
        ipv4_address: 10.95.0.20

  # The IPsec peer on the VPN side: strongSwan in server-a's network
  # namespace, i.e. on the far side of the tunnel like the probe, with its
  # own IKE address 198.18.0.2 and the inner network 10.96.2.0/24.
  peer-ipsec:
    image: tunneldeck-e2e-node:local
    command: [ipsec]
    cap_add: [NET_ADMIN]
    network_mode: service:server-a
    depends_on: [server-a]
    environment:
      PUBLIC_ADDRESS: 198.18.0.2/32
      INNER_ADDRESS: 10.96.2.1/24

configs:
  settings-v1:
    file: testdata/settings-v1.json
  linux44-ip:
    file: testdata/linux44-ip.sh
  no-connmark-iptables:
    file: testdata/no-connmark-iptables.sh

networks:
  e2e: {}
  # The LAN of the TunnelDeck host. The subnet is fixed so the LAN devices
  # and the firewall rules can name addresses.
  lan:
    ipam:
      config:
        - subnet: 10.95.0.0/24
