# Included by /etc/strongswan.conf. The test loads the connections with
# swanctl at run time (ipsec_test.go).
charon {
	# bypass-lan would add pass policies for the directly connected
	# networks; the test wants only the policies of its own SAs.
	plugins {
		bypass-lan {
			load = no
		}
	}
	# Log to stderr, so "docker compose logs" shows the IKE dialogue.
	filelog {
		stderr {
			default = 1
			ike = 2
		}
	}
}
