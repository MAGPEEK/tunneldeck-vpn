# Included by /etc/strongswan.conf. The connections are in
# /etc/swanctl/conf.d/e2e.conf; the entrypoint loads them.
charon {
	# The IKEv1 user access (FRITZ!Box-like) is Aggressive Mode with a
	# pre-shared key, which strongSwan refuses as responder by default.
	i_dont_care_about_security_and_use_aggressive_mode_psk = yes
	plugins {
		# Only the policies of the test's own SAs.
		bypass-lan {
			load = no
		}
		# MD4 for EAP-MSCHAPv2.
		openssl {
			load_legacy = yes
		}
	}
	filelog {
		# "docker compose logs" shows the IKE dialogue.
		stderr {
			default = 1
		}
		# The test counts the authentication attempts in this file.
		e2e {
			path = /run/e2e/charon.log
			# Every line at once, so the test reads what charon did so far.
			flush_line = yes
			default = 1
		}
	}
}
