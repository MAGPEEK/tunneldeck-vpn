# Connections of the IPsec test gateway (README.md, "Variant E"). The
# throwaway credentials are repeated in ipsec_gateway_test.go. Every
# connection answers on any address; the gateway picks one by the
# client's identity. IKEv2 offers TunnelDeck's default proposals, so the
# test knows what is negotiated, and nothing with AES-128: a client that
# offers only that gets NO_PROPOSAL_CHOSEN.
connections {
	# IKEv2 with a pre-shared key; the client sends no gateway identity.
	psk {
		version = 2
		proposals = aes256gcm16-prfsha384-curve25519-ecp384-ecp256-modp3072, aes256-sha256-modp2048
		pools = psk
		local {
			auth = psk
			id = ipsec-gw.e2e
		}
		remote {
			auth = psk
			id = psk.client.e2e
		}
		children {
			psk {
				local_ts = 0.0.0.0/0
				esp_proposals = aes256gcm16-curve25519-ecp256-modp3072, aes256-sha256-modp2048
			}
		}
	}
	# IKEv2 with certificates on both sides. The gateway narrows the
	# client's 0.0.0.0/0 to its own address and the network behind it.
	certificate {
		version = 2
		proposals = aes256gcm16-prfsha384-curve25519-ecp384-ecp256-modp3072, aes256-sha256-modp2048
		pools = certificate
		local {
			auth = pubkey
			certs = gateway.crt
			id = ipsec-gw.e2e
		}
		remote {
			auth = pubkey
			id = client.ipsec.e2e
			cacerts = ca.crt
		}
		children {
			certificate {
				local_ts = 10.94.6.1/32, 10.99.0.0/24
				esp_proposals = aes256gcm16-curve25519-ecp256-modp3072, aes256-sha256-modp2048
			}
		}
	}
	# IKEv2 with EAP-MSCHAPv2 for the client and a certificate for the
	# gateway.
	eap {
		version = 2
		proposals = aes256gcm16-prfsha384-curve25519-ecp384-ecp256-modp3072, aes256-sha256-modp2048
		pools = eap
		local {
			auth = pubkey
			certs = gateway.crt
			id = ipsec-gw.e2e
		}
		remote {
			auth = eap-mschapv2
			eap_id = %any
		}
		children {
			eap {
				local_ts = 0.0.0.0/0
				esp_proposals = aes256gcm16-curve25519-ecp256-modp3072, aes256-sha256-modp2048
			}
		}
	}
	# IKEv1 Aggressive Mode with a pre-shared key and XAuth, like the
	# FRITZ!Box user access; only the network behind the gateway.
	xauth {
		version = 1
		aggressive = yes
		proposals = aes256-sha384-ecp384, aes256-sha256-modp2048
		pools = xauth
		local {
			auth = psk
			id = ipsec-gw.e2e
		}
		remote {
			auth = psk
			id = xauth.client.e2e
		}
		remote-xauth {
			auth = xauth
		}
		children {
			xauth {
				local_ts = 10.99.0.0/24
				esp_proposals = aes256gcm16-ecp256, aes256-sha256-ecp256
			}
		}
	}
	# IKEv2 net-to-net: the LAN of the firewall topology with its own
	# addresses to the network 10.98.0.0/24 behind the gateway.
	net {
		version = 2
		proposals = aes256gcm16-prfsha384-curve25519-ecp384-ecp256-modp3072, aes256-sha256-modp2048
		local {
			auth = psk
			id = ipsec-gw.e2e
		}
		remote {
			auth = psk
			id = net.client.e2e
		}
		children {
			net {
				local_ts = 10.98.0.0/24
				remote_ts = 10.95.0.0/24
				esp_proposals = aes256gcm16-curve25519-ecp256-modp3072, aes256-sha256-modp2048
			}
		}
	}
}

# One virtual IP pool per sign-in method, so the test sees which
# connection answered; .1 of each is the gateway's own address.
pools {
	psk {
		addrs = 10.94.5.10-10.94.5.99
	}
	certificate {
		addrs = 10.94.6.10-10.94.6.99
	}
	eap {
		addrs = 10.94.7.10-10.94.7.99
	}
	xauth {
		addrs = 10.94.8.10-10.94.8.99
	}
}

secrets {
	ike-any {
		secret = "e2e IPsec pre-shared key of 32+ chars"
	}
	eap-user {
		id = e2e-user
		secret = "e2e ipsec pass word;#1"
	}
	xauth-user {
		id = e2e-user
		secret = "e2e ipsec pass word;#1"
	}
}
